# Four concurrent experiments, one per physical GPU 4/5/6/7.
seed: 42
python: /home/lettuce/miniconda3/envs/grid/bin/python
output_root: outputs/rq_cross_validation/seed42
embedding_snapshot: /home/yangyujie/.cache/huggingface/hub/models--google--flan-t5-xl/snapshots/7d6315df2c2fb742f0f5b556879d730926ca9001
beauty_embedding: logs/inference/runs/2026-10-22/09-26-23/pickle/merged_predictions_tensor.pt
embedding_dim: 2048
semantic_levels: 3
codebook_width: 256
minimum_free_disk_gib: 20
minimum_free_gpu_gib: 12
master_ports:
- 29540
- 29541
- 29542
- 29543
datasets:
  beauty: data/amazon_data/beauty
  toys: data/amazon_data/toys
experiments:
  beauty_rqkmeans:
    dataset: beauty
    tokenizer: rqkmeans
  beauty_rqvae:
    dataset: beauty
    tokenizer: rqvae
  toys_rqvae:
    dataset: toys
    tokenizer: rqvae
  toys_rqkmeans:
    dataset: toys
    tokenizer: rqkmeans
tokenizer:
  use_recipe_defaults: true
  devices_per_experiment: 1
recommender:
  config: configs/analysis/rq_recommender.yaml
  max_epochs: 150
  accumulation_steps: 16
  precision: bf16-mixed
analysis:
  batch_size: 8
  beam_widths:
  - 10
  - 20
  - 50
  k_values:
  - 5
  - 10
  bootstrap_replicates: 2000
  smoke_samples: 16
study_version: 2
sid_gpus: 4,5,6,7
gpus: 4,5,6,7
allow_gpu_sharing: true

# XL preserves the legacy source and reusable Beauty vectors above.
embedding_model: flan-t5-xl
embedding_models:
  flan-t5-xl:
    model_id: google/flan-t5-xl
    source: ${embedding_snapshot}
    embedding_dim: 2048
    beauty_embedding: ${beauty_embedding}
  flan-t5-base:
    model_id: google/flan-t5-base
    # Already downloaded locally; a repository ID also resolves the HF cache offline.
    source: cache
    embedding_dim: 768
    beauty_embedding: null
